services:
  # ============================================================================
  # 1. Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: gallery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gallery_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gallery_net

  # ============================================================================
  # 2. Backend API: Python Flask + Gunicorn + Prometheus Exporter
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gallery_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-gallery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gallery_db}
      SECRET_KEY: ${SECRET_KEY:-photo-gallery-super-secret-key-change-in-production}
      FLASK_ENV: production
      FLASK_DEBUG: "false"
    volumes:
      - media_uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gallery_net

  # ============================================================================
  # 3. Frontend: React + Vite + Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gallery_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gallery_net

  # ============================================================================
  # 4. Reverse Proxy: Nginx Gateway (Port 80 & 8080)
  # ============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gallery_gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - gallery_net

  # ============================================================================
  # 5. Monitoring: Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: gallery_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - gallery_net

  # ============================================================================
  # 6. Monitoring Dashboard: Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: gallery_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - gallery_net

# Persistent Storage Volumes
volumes:
  postgres_data:
    driver: local
  media_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Isolated Bridge Network
networks:
  gallery_net:
    driver: bridge
