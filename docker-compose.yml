version: '3.8'

# ==============================================================================
# HỆ THỐNG THƯ VIỆN ẢNH TRỰC TUYẾN (ONLINE GALLERY SYSTEM)
# Cấu hình Docker Compose chuẩn Enterprise:
# - PostgreSQL 16
# - Backend Flask API (Gunicorn)
# - Frontend React + Vite
# - Nginx Reverse Proxy (Port 8088 - Tránh trùng port 80)
# - Prometheus Monitoring (Port 9090)
# - Grafana Dashboards (Port 3001 - Tránh trùng port 3000)
# - Automated Backup Service
# ==============================================================================

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: gallery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gallery_db}
      POSTGRES_USER: ${POSTGRES_USER:-gallery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery_secure_pass_2026}
    ports:
      - "${PORT_POSTGRES:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gallery_user} -d ${POSTGRES_DB:-gallery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gallery_network

  # 2. Backend Flask API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gallery_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gallery_user}:${POSTGRES_PASSWORD:-gallery_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-gallery_db}
      SECRET_KEY: ${SECRET_KEY:-gallery_super_secret_key_prod_2026_xyz}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt_super_secret_key_gallery_2026_abc}
      UPLOAD_FOLDER: /app/uploads
      BACKUP_DIR: /app/backups
      FLASK_ENV: production
      PORT_BACKEND: 5000
    ports:
      - "${PORT_BACKEND:-5001}:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - gallery_network

  # 3. Frontend React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gallery_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - gallery_network

  # 4. Nginx Reverse Proxy (Cổng truy cập chính)
  nginx:
    image: nginx:alpine
    container_name: gallery_nginx
    restart: unless-stopped
    ports:
      - "${PORT_NGINX:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gallery_network

  # 5. Giám sát Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: gallery_prometheus
    restart: unless-stopped
    ports:
      - "${PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - gallery_network

  # 6. Trực quan hóa Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: gallery_grafana
    restart: unless-stopped
    ports:
      - "${PORT_GRAFANA:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gallery_network

  # 7. Dịch vụ tự động sao lưu dữ liệu (Daily Backup)
  backup:
    image: postgres:16-alpine
    container_name: gallery_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-gallery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gallery_db}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - ./uploads:/app/uploads:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup.sh && while true; do /backup.sh; sleep 86400; done"]
    networks:
      - gallery_network

networks:
  gallery_network:
    driver: bridge

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
