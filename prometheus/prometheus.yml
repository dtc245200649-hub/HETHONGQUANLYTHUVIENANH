global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape Flask Gallery Backend
  - job_name: 'gallery_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          application: 'gallery-backend'
          environment: 'production'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
