global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Python Flask Backend Metrics Exporter
  - job_name: 'gallery-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: 'photo-gallery-api'
          environment: 'production'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor Container Metrics Exporter
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'container-metrics'
          environment: 'production'
